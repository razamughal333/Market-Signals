<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="32" height="32" rx="7" fill="#0a0f1e"/>
  <!-- candlestick 1 (bearish, shorter) -->
  <line x1="9" y1="8" x2="9" y2="24" stroke="#f87171" stroke-width="1.5"/>
  <rect x="6.5" y="13" width="5" height="7" rx="1" fill="#f87171"/>
  <!-- candlestick 2 (bullish, taller, center) -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#34d399" stroke-width="1.5"/>
  <rect x="13.5" y="10" width="5" height="12" rx="1" fill="#34d399"/>
  <!-- candlestick 3 (bullish, shorter) -->
  <line x1="23" y1="9" x2="23" y2="23" stroke="#34d399" stroke-width="1.5"/>
  <rect x="20.5" y="14" width="5" height="6" rx="1" fill="#34d399"/>
</svg>
